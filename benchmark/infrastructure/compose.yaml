# Declarative reference; the measurement controller uses its ownership-checked lifecycle.
# Choose exactly ONE profile; these are disposable benchmark resources.
services:
  postgresql:
    profiles: [postgresql]
    image: postgres@sha256:9770878138a2e83abcb10856d30cc3f24dae0d317bb956db6ab9159de6c3c80d
    platform: linux/amd64
    cpuset: ${BENCH_DB_CPUSET:?Explicit disjoint database CPU allocation required}
    mem_limit: ${BENCH_DB_MEMORY_BYTES:?Explicit database memory budget required}
    labels:
      benchmark.owner: ${BENCH_OWNER_TOKEN:?Controller ownership token required}
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${BENCH_DATABASE_PASSWORD:?Private generated password required}
    ports:
      - target: 5432
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: [CMD, pg_isready, -U, benchmark, -d, postgres]
      interval: 1s
      timeout: 5s
      retries: 120
  sqlserver:
    profiles: [sqlserver]
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    cpuset: ${BENCH_DB_CPUSET:?Explicit disjoint database CPU allocation required}
    mem_limit: ${BENCH_DB_MEMORY_BYTES:?Explicit database memory budget required}
    labels:
      benchmark.owner: ${BENCH_OWNER_TOKEN:?Controller ownership token required}
    environment:
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${BENCH_DATABASE_PASSWORD:?Private generated password required}
      ACCEPT_EULA: ${BENCH_SQLSERVER_ACCEPT_EULA:-N}
    ports:
      - target: 1433
        published: "0"
        host_ip: 127.0.0.1
        protocol: tcp
